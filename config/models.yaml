# Model configuration: maps abstract tiers (agents/*.yaml -> llm.tier) to concrete local models.
# The mock stays the default; start with `python -m myriad --provider ollama` to use Ollama.
# No paid cloud APIs (see docs/ROADMAP.md, phase 9).

default_provider: mock

ollama:
  base_url: http://127.0.0.1:11434
  timeout_seconds: 180
  decision_mode: tools  # free-text answers + native tool calls; "json" forces decision JSON

forge:
  executor: claude_code
  command: auto  # auto: newest Claude Code bundled with the VS Code extension, else `claude` on PATH
  repo: data/projects/practice  # target repository, relative to the MYRIAD folder (practice repo first)
  timeout_seconds: 900
  # Claude Code's tools inside the worktree; in headless mode every other call is denied.
  allowed_tools: "Read Edit Write Glob Grep Bash(python -m unittest:*) Bash(python -m pytest:*)"
  test_command: ["python", "-m", "unittest", "discover", "-s", "tests", "-q"]

tiers:
  reasoning:
    model: qwen3:8b       # 4.9 GB, fits an 8 GB GPU together with the context below
    context_window: 8192  # sent to Ollama as num_ctx; also the window used for token budgeting
